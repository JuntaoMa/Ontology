[project]
name = "ontology-rag-demo"
version = "0.2.0"
description = "Reusable ACP test console with self-contained ontology Profile packages"
readme = "README.md"
requires-python = "==3.13.7"
dependencies = [
    "lancedb>=0.24,<1",
    "networkx>=3.5,<4",
    "numpy>=2.3,<3",
    "pyarrow>=20,<24",
    "rdflib>=7.1,<8",
    "sentence-transformers>=5,<6",
    "torch>=2.8,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

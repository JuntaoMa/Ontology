[project]
name = "ontology-rag-demo"
version = "0.1.0"
description = "Reproducible ontology RAG demo with BGE-M3, LanceDB and graph retrieval"
readme = "README.md"
requires-python = "==3.13.7"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "lancedb>=0.24,<1",
    "networkx>=3.5,<4",
    "numpy>=2.3,<3",
    "pyarrow>=20,<24",
    "pydantic-settings>=2.10,<3",
    "rdflib>=7.1,<8",
    "sentence-transformers>=5,<6",
    "torch>=2.8,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
ontology-rag = "ontology_rag_demo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_rag_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

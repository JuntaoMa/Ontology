schema_version: 1
id: dev
revision: dev
title: Ontology RAG Development
description: 本地 Agent Profile 示例，用于验证本体层检索与端到端问答流程。

runtime:
  command: opencode
  args:
    - acp
    - --print-logs
  cwd: ../..
  startup_timeout_ms: 30000

opencode:
  config: opencode/opencode.jsonc

model:
  # Public placeholder. Use a deployment-specific Profile for the real model id.
  id: qwen-compatible/qwen-model
  source: profile
  api_base:
    env: QWEN_BASE_URL
  auth:
    source: environment
    api_key:
      env: QWEN_API_KEY

skills:
  - id: ontology-retrieval
    path: ../_shared/skills/ontology-retrieval

retrieval:
  endpoint:
    env: OAG_BASE_URL
  vector_top_k: 5
  graph_algorithm: minimum_connected_subgraph

ontology:
  id: smart-building-sample
